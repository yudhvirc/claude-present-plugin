<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root, html[data-theme="dark"] { --bg:#0f172a; --ink:#e2e8f0; --muted:#94a3b8; --stage:#0b1120; --border:#334155; --accent:#38bdf8; }
  html[data-theme="light"] { --bg:#f1f5f9; --ink:#0f172a; --muted:#475569; --stage:#ffffff; --border:#cbd5e1; --accent:#0284c7; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--ink); padding:32px; transition:background .2s,color .2s; }
  header { max-width:1200px; margin:0 auto 20px; }
  h1 { font-size:1.6rem; margin:0; }
  .stage { max-width:1200px; margin:0 auto; background:var(--stage); border:1px solid var(--border);
           border-radius:14px; padding:24px; overflow:auto; }
  .mermaid { display:flex; justify-content:center; }
  footer { max-width:1200px; margin:20px auto 0; color:var(--muted); font-size:.8rem; }
  .toolbar { position:fixed; top:16px; right:18px; display:flex; gap:8px; z-index:50; }
  .toolbar button { background:var(--stage); color:var(--ink); border:1px solid var(--border); border-radius:8px;
                    padding:6px 12px; font-size:.85rem; cursor:pointer; }
  .toolbar button:hover { border-color:var(--accent); }
  @media print {
    @page { margin: 12mm; }
    body { background:#fff; padding:0; }
    .toolbar { display:none !important; }
    .stage { max-width:none; border:0; break-inside:avoid; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button id="themeBtn" onclick="toggleTheme()">☀ Light</button>
  <button onclick="printPage()" title="Save as PDF (P)">⤓ PDF</button>
</div>

<header><h1>{{TITLE}}</h1></header>

<div class="stage">
  <!-- DIAGRAM placeholder below: raw Mermaid source between the tags (NOT fenced), e.g.
       flowchart TD
         A[Start] --> B{Valid?}
         B -- yes --> C[Continue]
         B -- no  --> D[Reject]
  -->
  <pre class="mermaid" id="diagram">
{{DIAGRAM}}
  </pre>
</div>

<footer>Generated by /present · self-contained, opens in any browser. {{DEFINITION_BLOCK}}</footer>

<!-- LIB placeholder below: inline the bundled Mermaid here (fully-local) OR a CDN script tag -->
{{LIB}}
<script>
  const host = document.getElementById('diagram');
  const SRC = host.textContent;          // capture raw source before Mermaid processes it

  function renderMermaid(){
    const theme = document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'default';
    host.removeAttribute('data-processed');
    host.innerHTML = SRC;
    mermaid.initialize({ startOnLoad:false, theme:theme, securityLevel:'loose' });
    return mermaid.run({ nodes:[host] });
  }
  function setTheme(t){ document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('viz-theme', t); }catch(e){}
    document.getElementById('themeBtn').textContent = (t==='dark' ? '☀ Light' : '☾ Dark');
    renderMermaid(); }
  function toggleTheme(){ setTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark'); }

  // PDF export: render the light Mermaid theme for readable paper, then restore.
  let _prevTheme=null;
  function printPage(){
    _prevTheme = document.documentElement.getAttribute('data-theme');
    if(_prevTheme!=='light'){ document.documentElement.setAttribute('data-theme','light'); }
    Promise.resolve(renderMermaid()).then(()=> window.print());
  }
  window.addEventListener('afterprint', function(){
    if(_prevTheme && _prevTheme!=='light'){ document.documentElement.setAttribute('data-theme',_prevTheme); renderMermaid(); _prevTheme=null; }
  });
  document.addEventListener('keydown', e=>{ if(e.key==='p'||e.key==='P'){ printPage(); e.preventDefault(); } });

  (function(){ let t='dark'; try{ t=localStorage.getItem('viz-theme')||'dark'; }catch(e){} setTheme(t); })();
</script>
</body>
</html>
