<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechCorp — 2025 Performance</title>
<style>
  /* Theme variables — toggled via <html data-theme="…"> */
  :root, html[data-theme="dark"] {
    --bg:#0f172a; --card:#1e293b; --ink:#e2e8f0; --muted:#94a3b8; --grid:#334155; --border:#334155; --accent:#38bdf8;
  }
  html[data-theme="light"] {
    --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --muted:#475569; --grid:#e2e8f0; --border:#cbd5e1; --accent:#0284c7;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--ink); padding:32px; transition:background .2s,color .2s; }
  header { max-width:1100px; margin:0 auto 24px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  header p { color:var(--muted); margin:0; }
  .grid { max-width:1100px; margin:0 auto; display:grid; gap:20px;
          grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; }
  .card h2 { font-size:1rem; font-weight:600; margin:0 0 12px; color:var(--ink); }
  .card .wrap { position:relative; height:320px; }
  footer { max-width:1100px; margin:24px auto 0; color:var(--muted); font-size:.8rem; }

  /* Floating toolbar */
  .toolbar { position:fixed; top:16px; right:18px; display:flex; gap:8px; z-index:50; }
  .toolbar button { background:var(--card); color:var(--ink); border:1px solid var(--border); border-radius:8px;
                    padding:6px 12px; font-size:.85rem; cursor:pointer; }
  .toolbar button:hover { border-color:var(--accent); }

  @media print {
    @page { margin: 12mm; }
    body { background:#fff; padding:0; }
    .toolbar { display:none !important; }
    .grid { max-width:none; }
    .card { break-inside:avoid; border-color:#cbd5e1; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button id="themeBtn" onclick="toggleTheme()">☀ Light</button>
  <button onclick="printPage()" title="Save as PDF (P)">⤓ PDF</button>
</div>

<header>
  <h1>TechCorp — 2025 Performance</h1>
  <p></p>
</header>

<div class="grid">
  
  <div class="card"><h2>Monthly revenue ($)</h2><div class="wrap"><canvas id="c1"></canvas></div></div>
  <div class="card"><h2>New customers / month</h2><div class="wrap"><canvas id="c2"></canvas></div></div>
  <div class="card"><h2>Churn rate (%)</h2><div class="wrap"><canvas id="c3"></canvas></div></div>
  <div class="card"><h2>Revenue by region ($)</h2><div class="wrap"><canvas id="c4"></canvas></div></div>
</div>

<footer>Generated by /present · self-contained, opens in any browser.</footer>




<script>
  // --- Theme + chart color sync ---------------------------------------------
  function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function applyChartDefaults(){ if(typeof Chart==='undefined') return;
    Chart.defaults.color = cssVar('--ink'); Chart.defaults.borderColor = cssVar('--grid'); }
  function eachChart(fn){ if(typeof Chart==='undefined') return;
    document.querySelectorAll('canvas').forEach(cv=>{ const c=Chart.getChart(cv); if(c){ try{ fn(c); }catch(e){} } }); }
  function syncCharts(){ applyChartDefaults(); eachChart(c=> c.update()); }
  function setTheme(t){ document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('viz-theme', t); }catch(e){}
    document.getElementById('themeBtn').textContent = (t==='dark' ? '☀ Light' : '☾ Dark');
    syncCharts(); }
  function toggleTheme(){ setTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark'); }
  (function(){ let t='dark'; try{ t=localStorage.getItem('viz-theme')||'dark'; }catch(e){} setTheme(t); })();
  applyChartDefaults(); // set defaults BEFORE charts below are created

  // --- PDF export (prints in light theme for readable paper, then restores) --
  let _prevTheme=null;
  window.addEventListener('beforeprint', function(){
    _prevTheme = document.documentElement.getAttribute('data-theme');
    if(_prevTheme!=='light'){ document.documentElement.setAttribute('data-theme','light'); applyChartDefaults(); }
    eachChart(c=>{ c.resize(); c.update('none'); });
  });
  window.addEventListener('afterprint', function(){
    if(_prevTheme && _prevTheme!=='light'){ document.documentElement.setAttribute('data-theme',_prevTheme); applyChartDefaults(); }
    eachChart(c=>{ c.resize(); c.update('none'); });
  });
  function printPage(){ window.print(); }
  document.addEventListener('keydown', e=>{ if(e.key==='p'||e.key==='P'){ printPage(); e.preventDefault(); } });

  // --- Charts ----------------------------------------------------------------
  // SCRIPT placeholder below: one `new Chart(...)` per canvas. Do NOT hardcode tick/grid colors —
  // leave them out so they inherit Chart.defaults and follow the theme. Example:
  // new Chart(document.getElementById('chart1'), {
  //   type:'bar',
  //   data:{ labels:['Jan','Feb','Mar'], datasets:[{ label:'Revenue', data:[12,19,8],
  //          backgroundColor:'#38bdf8' }] },
  //   options:{ responsive:true, maintainAspectRatio:false }
  // });
  const M=["2025-01","2025-02","2025-03","2025-04","2025-05","2025-06","2025-07","2025-08","2025-09","2025-10","2025-11","2025-12"];
  new Chart(c1,{type:'line',data:{labels:M,datasets:[{label:'Revenue',data:[182000,195400,211800,204300,228900,247600,239100,258700,276400,291200,310500,342800],borderColor:'#38bdf8',backgroundColor:'rgba(56,189,248,.15)',fill:true,tension:.3}]},options:{responsive:true,maintainAspectRatio:false}});
  new Chart(c2,{type:'bar',data:{labels:M,datasets:[{label:'New',data:[48,55,61,52,67,74,69,78,83,88,95,104],backgroundColor:'#34d399'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
  new Chart(c3,{type:'line',data:{labels:M,datasets:[{label:'Churn %',data:[3.2,3,2.8,3.1,2.6,2.4,2.7,2.3,2.1,2.2,1.9,1.7],borderColor:'#f87171',tension:.3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
  new Chart(c4,{type:'doughnut',data:{labels:["North America","Europe","Asia Pacific","Latin America","Middle East & Africa"],datasets:[{data:[1284000,842500,596300,231800,148900],backgroundColor:['#38bdf8','#34d399','#fbbf24','#f87171','#a78bfa']}]},options:{responsive:true,maintainAspectRatio:false}});
</script>
</body>
</html>
