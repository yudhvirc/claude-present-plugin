<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root, html[data-theme="dark"] { --bg:#0b1220; --ink:#f1f5f9; --muted:#94a5be; --accent:#38bdf8; --accent2:#818cf8; --card:#141f33; --grid:#243149; }
  html[data-theme="light"] { --bg:#f5f7fb; --ink:#0f1b2e; --muted:#4a5a72; --accent:#0284c7; --accent2:#4f46e5; --card:#ffffff; --grid:#e6ebf3; }
  .slide.title { background:radial-gradient(900px 500px at 20% 10%, rgba(56,189,248,.16), rgba(56,189,248,0) 60%), linear-gradient(135deg,#0e1a30,#0b1220); }
  html[data-theme="light"] .slide.title { background:radial-gradient(900px 500px at 20% 10%, rgba(2,132,199,.12), rgba(2,132,199,0) 60%), linear-gradient(135deg,#eaf2fb,#f5f7fb); }
  /* Fonts — theme-independent. Default = system stack. Override for an aesthetic direction with an
     OFFLINE system-font preset (see references/authoring.md -> "Visual polish"); never load fonts over the network. */
  :root { --display-font: system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
          --body-font:    system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { font-family: var(--body-font);
         background:var(--bg); color:var(--ink); overflow:hidden; }

  .deck { position:fixed; inset:0; }
  .slide { position:absolute; inset:0; display:none; flex-direction:column;
           justify-content:center; align-items:center; text-align:center;
           padding:6vw; animation:fade .35s ease; }
  .slide.active { display:flex; }
  @keyframes fade { from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;} }
  .slide h1 { font-size:clamp(1.9rem, 4vw, 3.6rem); margin:0 0 .4em; line-height:1.1; font-family: var(--display-font); }
  .slide h2 { font-size:clamp(1.4rem, 3vw, 2.7rem); margin:0 0 .5em; font-family: var(--display-font); }
  .slide p, .slide li { font-size:clamp(1rem, 1.9vw, 1.4rem); color:var(--ink); line-height:1.5; max-width:70ch; }
  .slide ul { text-align:left; }
  .slide .chart-wrap { position:relative; width:min(70vw,900px); height:52vh; }
  .slide.title { background:linear-gradient(135deg,#0f172a,#1e3a5f); }

  /* Chrome */
  .bar { position:fixed; left:0; right:0; bottom:0; height:5px; background:#1e293b; z-index:20; }
  .bar > span { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
  .hud { position:fixed; bottom:16px; right:20px; z-index:20; display:flex; gap:8px; align-items:center;
         color:var(--muted); font-size:.85rem; }
  .hud button { background:var(--card); color:var(--ink); border:1px solid #334155; border-radius:8px;
                padding:6px 12px; font-size:.9rem; cursor:pointer; }
  .hud button:hover { border-color:var(--accent); }
  .help { position:fixed; bottom:16px; left:20px; z-index:20; color:var(--muted); font-size:.75rem; }

  /* Speaker notes */
  #notes { position:fixed; left:0; right:0; bottom:0; max-height:34vh; overflow:auto;
           background:#020617; border-top:2px solid var(--accent); padding:16px 22px;
           display:none; z-index:30; font-size:1rem; color:#e2e8f0; }
  #notes.show { display:block; }
  #notes b { color:var(--accent); }

  /* Overview grid */
  .deck.overview { overflow:auto; background:#020617; }
  .deck.overview .slide { position:relative; inset:auto; display:flex; margin:2vh auto; width:44vw;
           height:26vh; border:2px solid #334155; border-radius:10px; cursor:pointer; transform:scale(1);
           padding:2vw; animation:none; }
  .deck.overview .slide h1 { font-size:1.6vw; } .deck.overview .slide h2 { font-size:1.3vw; }
  .deck.overview .slide p, .deck.overview .slide li { font-size:1vw; }
  .deck.overview .slide:hover { border-color:var(--accent); }
  .deck.overview .chart-wrap { display:none; }

  /* Print / PDF export: reveal every slide, one per page, hide the chrome.
     `.printing` mirrors the print layout on screen so Chart.js canvases re-rasterize at the right size. */
  body.printing { overflow:visible; }
  body.printing .deck { position:static; }
  body.printing .deck.overview { overflow:visible; }
  body.printing .slide { display:flex !important; position:relative; inset:auto; width:100%; height:100vh;
           margin:0; border:0; border-radius:0; transform:none; animation:none; background:var(--bg); }
  body.printing .slide.title { background:linear-gradient(135deg,#0f172a,#1e3a5f); }
  body.printing .chart-wrap { height:60vh; }
  body.printing .bar, body.printing .hud, body.printing .help, body.printing #notes { display:none !important; }
  body.printing.print-notes .slide { justify-content:flex-start; padding-top:5vh; }
  body.printing.print-notes .slide::after { content:attr(data-notes); position:absolute; left:6vw; right:6vw; bottom:4vh;
           text-align:left; font-size:1rem; color:#94a3b8; border-top:1px solid #334155; padding-top:10px; }

  /* Mobile (swipe left/right to navigate; keyboard-hint bar hidden) */
  @media (max-width: 640px) {
    .slide { padding:10vw 7vw; }
    .help { display:none; }
    .hud { font-size:.78rem; gap:6px; bottom:12px; right:12px; }
    .hud button { padding:5px 9px; font-size:.82rem; }
    .slide .chart-wrap { width:88vw; height:44vh; }
    .deck.overview .slide { width:90vw; height:auto; min-height:22vh; }
    #notes { font-size:.9rem; padding:12px 16px; }
  }
  @media print {
    @page { size: landscape; margin: 0; }
    html, body { background:#fff; height:auto; }
    .slide { display:flex !important; position:relative; inset:auto; width:100%; height:100vh;
             break-after:page; page-break-after:always;
             -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .slide:last-child { break-after:auto; page-break-after:auto; }
    .bar, .hud, .help, #notes { display:none !important; }
  }
</style>
</head>
<body>

<div class="deck" id="deck">
  <!-- SLIDES placeholder below: one <section class="slide"> per slide.
       Add data-notes="…" for speaker notes. First slide can use class="slide title".
       Example:
  <section class="slide title" data-notes="Welcome the audience. 30 seconds.">
    <h1>Quarterly Review</h1><p>FY2026 · Prepared by …</p>
  </section>
  <section class="slide" data-notes="Walk through the three drivers.">
    <h2>Revenue drivers</h2>
    <ul><li>New enterprise logos</li><li>Expansion</li><li>Lower churn</li></ul>
  </section>
  <section class="slide" data-notes="Numbers are up and to the right.">
    <h2>Revenue by quarter</h2>
    <div class="chart-wrap"><canvas id="deckChart1"></canvas></div>
  </section>
  -->
  {{SLIDES}}
</div>

<div class="bar"><span id="progress"></span></div>
<div class="hud">
  <button onclick="go(-1)">‹ Prev</button>
  <span id="counter">1 / 1</span>
  <button onclick="go(1)">Next ›</button>
  <button id="themeBtn" onclick="toggleTheme()" title="Toggle light/dark (T)">☀ Light</button>
  <button onclick="printDeck()" title="Save deck as PDF (P)">⤓ PDF</button>
</div>
<div class="help">← → nav · <b>F</b> fullscreen · <b>S</b> notes · <b>Esc</b> overview · <b>T</b> theme · <b>P</b> PDF</div>
<div id="notes"></div>

<!-- LIB placeholder below: inline the bundled Chart.js here ONLY if a slide has a chart (fully-local), or a CDN tag. Omit if no charts. -->
{{LIB}}

<script>
(function(){
  const deck = document.getElementById('deck');
  const slides = Array.from(deck.querySelectorAll('.slide'));
  const counter = document.getElementById('counter');
  const progress = document.getElementById('progress');
  const notes = document.getElementById('notes');
  let i = 0, overview = false, notesOn = false;

  function render(){
    slides.forEach((s,n)=> s.classList.toggle('active', n===i));
    counter.textContent = (i+1) + ' / ' + slides.length;
    progress.style.width = ((i+1)/slides.length*100) + '%';
    const n = slides[i].getAttribute('data-notes') || '';
    notes.innerHTML = '<b>Slide ' + (i+1) + ' notes:</b> ' + (n || '—');
    location.hash = '#' + (i+1);
  }
  window.go = function(d){
    if(overview) return;
    i = Math.max(0, Math.min(slides.length-1, i+d));
    render();
  };
  function toggleOverview(){
    overview = !overview;
    deck.classList.toggle('overview', overview);
    if(!overview) render();
  }
  slides.forEach((s,n)=> s.addEventListener('click', ()=>{ if(overview){ i=n; toggleOverview(); }}));

  document.addEventListener('keydown', function(e){
    switch(e.key){
      case 'ArrowRight': case 'ArrowDown': case ' ': case 'PageDown': go(1); e.preventDefault(); break;
      case 'ArrowLeft': case 'ArrowUp': case 'PageUp': go(-1); e.preventDefault(); break;
      case 'Home': i=0; render(); break;
      case 'End': i=slides.length-1; render(); break;
      case 'f': case 'F':
        if(!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen(); break;
      case 's': case 'S': notesOn=!notesOn; notes.classList.toggle('show', notesOn); break;
      case 't': case 'T': toggleTheme(); break;
      case 'p': case 'P': printDeck(); e.preventDefault(); break;
      case 'Escape': toggleOverview(); break;
    }
  });

  // Theme (light/dark) — persisted, and applied to Chart.js via defaults.
  function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function applyChartDefaults(){ if(typeof Chart==='undefined') return;
    Chart.defaults.color = cssVar('--ink'); Chart.defaults.borderColor = cssVar('--grid'); }
  function setTheme(t){ document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('viz-theme', t); }catch(e){}
    const b=document.getElementById('themeBtn'); if(b) b.textContent = (t==='dark' ? '☀ Light' : '☾ Dark');
    applyChartDefaults(); eachChart(c=> c.update()); renderMermaid(); }
  function toggleTheme(){ setTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark'); }

  // Mermaid diagrams on slides stay theme-synced. Inline Mermaid at the library slot above and put a
  // <pre class="mermaid">…source…</pre> on a slide — the deck renders it and re-themes it automatically.
  var _mmd = [];
  function initMermaidSources(){ if(typeof mermaid==='undefined') return;
    document.querySelectorAll('pre.mermaid, .mermaid').forEach(el=> _mmd.push([el, el.textContent])); }
  function mmVars(dark){ return dark ? {
    darkMode:true, background:'transparent', fontFamily:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif", fontSize:'14px',
    primaryColor:'#1e293b', mainBkg:'#1e293b', primaryBorderColor:'#475569', nodeBorder:'#475569',
    primaryTextColor:'#f1f5f9', nodeTextColor:'#f1f5f9', textColor:'#f1f5f9', titleColor:'#f1f5f9',
    lineColor:'#64748b', secondaryColor:'#0b1120', tertiaryColor:'#0b1120',
    clusterBkg:'rgba(148,163,184,0.08)', clusterBorder:'#334155', edgeLabelBackground:'#0f172a'
  } : {
    darkMode:false, background:'transparent', fontFamily:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif", fontSize:'14px',
    primaryColor:'#f1f5f9', mainBkg:'#f1f5f9', primaryBorderColor:'#94a3b8', nodeBorder:'#94a3b8',
    primaryTextColor:'#0f172a', nodeTextColor:'#0f172a', textColor:'#0f172a', titleColor:'#0f172a',
    lineColor:'#64748b', secondaryColor:'#f1f5f9', tertiaryColor:'#f1f5f9',
    clusterBkg:'rgba(2,132,199,0.06)', clusterBorder:'#cbd5e1', edgeLabelBackground:'#ffffff'
  }; }
  function renderMermaid(){ if(typeof mermaid==='undefined' || !_mmd.length) return;
    var dark = document.documentElement.getAttribute('data-theme')==='dark';
    mermaid.initialize({ startOnLoad:false, theme:'base', themeVariables:mmVars(dark),
      flowchart:{ curve:'basis', padding:14, useMaxWidth:true }, securityLevel:'loose' });
    _mmd.forEach(function(m){ m[0].removeAttribute('data-processed'); m[0].innerHTML = m[1]; });
    try{ mermaid.run({ nodes:_mmd.map(function(m){ return m[0]; }) }); }catch(e){} }

  // PDF export via the browser's print dialog ("Save as PDF"). Fully offline.
  // Set PRINT_NOTES=true to also print each slide's speaker notes beneath it.
  const PRINT_NOTES = false;
  function eachChart(fn){
    if(typeof Chart==='undefined') return;
    document.querySelectorAll('canvas').forEach(cv=>{ const c=Chart.getChart(cv); if(c){ try{ fn(c); }catch(e){} } });
  }
  window.addEventListener('beforeprint', function(){
    document.body.classList.add('printing');
    if(PRINT_NOTES) document.body.classList.add('print-notes');
    void document.body.offsetHeight;      // force reflow so canvases pick up print layout
    eachChart(c=> c.resize());
  });
  window.addEventListener('afterprint', function(){
    document.body.classList.remove('printing','print-notes');
    eachChart(c=> c.resize());
    render();
  });
  window.printDeck = function(){ if(overview) toggleOverview(); window.print(); };
  // Touch/swipe
  let x0=null;
  deck.addEventListener('touchstart', e=> x0=e.touches[0].clientX);
  deck.addEventListener('touchend', e=>{ if(x0===null) return;
    const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>50) go(dx<0?1:-1); x0=null; });

  const start = parseInt(location.hash.replace('#',''),10);
  if(start>=1 && start<=slides.length) i=start-1;
  render();

  // Capture any Mermaid sources, then apply saved/initial theme (renders diagrams + sets Chart.js defaults).
  initMermaidSources();
  (function(){ let t='dark'; try{ t=localStorage.getItem('viz-theme')||'dark'; }catch(e){} setTheme(t); })();

  // CHART_INIT placeholder below: build any per-slide charts here using Chart.js. Don't hardcode
  // tick/grid colors — leave them out so they follow the theme via Chart.defaults.
  // new Chart(document.getElementById('deckChart1'), { type:'line',
  //   data:{ labels:['Q1','Q2','Q3','Q4'], datasets:[{ label:'Revenue', data:[12,19,15,27],
  //          borderColor:'#38bdf8', backgroundColor:'rgba(56,189,248,.15)', fill:true, tension:.3 }] },
  //   options:{ responsive:true, maintainAspectRatio:false } });
  {{CHART_INIT}}
})();
</script>
</body>
</html>
