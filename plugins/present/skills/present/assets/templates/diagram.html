<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root, html[data-theme="dark"] { --bg:#0b1220; --ink:#e9eef7; --muted:#94a5be; --stage:#0e1728; --border:#243149; --accent:#38bdf8; --shadow:0 16px 40px -20px rgba(0,0,0,.65); }
  html[data-theme="light"] { --bg:#f5f7fb; --ink:#0f1b2e; --muted:#4a5a72; --stage:#ffffff; --border:#e6ebf3; --accent:#0284c7; --shadow:0 18px 44px -22px rgba(15,23,42,.18); }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--ink); padding:32px; transition:background .2s,color .2s; }
  header { max-width:1200px; margin:0 auto 20px; }
  h1 { font-size:1.6rem; margin:0; }
  .stage { max-width:1200px; margin:0 auto; background:var(--stage); border:1px solid var(--border); box-shadow:var(--shadow);
           border-radius:14px; padding:24px; overflow:auto; }
  .mermaid { display:flex; justify-content:center; }
  footer { max-width:1200px; margin:20px auto 0; color:var(--muted); font-size:.8rem; }
  .toolbar { position:fixed; top:16px; right:18px; display:flex; gap:8px; z-index:50; }
  .toolbar button { background:var(--stage); color:var(--ink); border:1px solid var(--border); border-radius:8px;
                    padding:6px 12px; font-size:.85rem; cursor:pointer; }
  .toolbar button:hover { border-color:var(--accent); }
  @media print {
    @page { margin: 12mm; }
    body { background:#fff; padding:0; }
    .toolbar { display:none !important; }
    .stage { max-width:none; border:0; break-inside:avoid; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button id="themeBtn" onclick="toggleTheme()">☀ Light</button>
  <button onclick="printPage()" title="Save as PDF (P)">⤓ PDF</button>
</div>

<header><h1>{{TITLE}}</h1></header>

<div class="stage">
  <!-- DIAGRAM placeholder below: put the raw Mermaid source (NOT fenced) between the pre tags.
       Structure only, no color styling. (Do not write example arrows here: a literal arrow token
       would end this HTML comment early and leak text into the page.) -->
  <pre class="mermaid" id="diagram">
{{DIAGRAM}}
  </pre>
</div>

<footer>Generated by /present · self-contained, opens in any browser. {{DEFINITION_BLOCK}}</footer>

<!-- LIB placeholder below: inline the bundled Mermaid here (fully-local) OR a CDN script tag -->
{{LIB}}
<script>
  const host = document.getElementById('diagram');
  const SRC = host.textContent;          // capture raw source before Mermaid processes it

  // Mermaid theme variables tuned to the plugin palette (base theme, light + dark).
  function mmVars(dark){ return dark ? {
    darkMode:true, background:'transparent', fontFamily:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif", fontSize:'14px',
    primaryColor:'#1e293b', mainBkg:'#1e293b', primaryBorderColor:'#475569', nodeBorder:'#475569',
    primaryTextColor:'#e2e8f0', nodeTextColor:'#e2e8f0', textColor:'#e2e8f0', titleColor:'#e2e8f0',
    lineColor:'#64748b', secondaryColor:'#0b1120', tertiaryColor:'#0b1120',
    clusterBkg:'rgba(148,163,184,0.08)', clusterBorder:'#334155', edgeLabelBackground:'#0f172a'
  } : {
    darkMode:false, background:'transparent', fontFamily:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif", fontSize:'14px',
    primaryColor:'#f1f5f9', mainBkg:'#f1f5f9', primaryBorderColor:'#94a3b8', nodeBorder:'#94a3b8',
    primaryTextColor:'#0f172a', nodeTextColor:'#0f172a', textColor:'#0f172a', titleColor:'#0f172a',
    lineColor:'#64748b', secondaryColor:'#f1f5f9', tertiaryColor:'#f1f5f9',
    clusterBkg:'rgba(2,132,199,0.06)', clusterBorder:'#cbd5e1', edgeLabelBackground:'#ffffff'
  }; }
  function renderMermaid(){
    const dark = document.documentElement.getAttribute('data-theme')==='dark';
    host.removeAttribute('data-processed');
    host.innerHTML = SRC;
    mermaid.initialize({ startOnLoad:false, theme:'base', themeVariables:mmVars(dark),
      flowchart:{ curve:'basis', padding:14, useMaxWidth:true }, securityLevel:'loose' });
    return mermaid.run({ nodes:[host] });
  }
  function setTheme(t){ document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('viz-theme', t); }catch(e){}
    document.getElementById('themeBtn').textContent = (t==='dark' ? '☀ Light' : '☾ Dark');
    renderMermaid(); }
  function toggleTheme(){ setTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark'); }

  // PDF export: render the light Mermaid theme for readable paper, then restore.
  let _prevTheme=null;
  function printPage(){
    _prevTheme = document.documentElement.getAttribute('data-theme');
    if(_prevTheme!=='light'){ document.documentElement.setAttribute('data-theme','light'); }
    Promise.resolve(renderMermaid()).then(()=> window.print());
  }
  window.addEventListener('afterprint', function(){
    if(_prevTheme && _prevTheme!=='light'){ document.documentElement.setAttribute('data-theme',_prevTheme); renderMermaid(); _prevTheme=null; }
  });
  document.addEventListener('keydown', e=>{ if(e.key==='p'||e.key==='P'){ printPage(); e.preventDefault(); } });

  (function(){ let t='dark'; try{ t=localStorage.getItem('viz-theme')||'dark'; }catch(e){} setTheme(t); })();
</script>
</body>
</html>
