<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  /* General self-contained HTML page — landing pages, reports, documents, dashboards.
     Theme-aware (light/dark toggle) + PDF export, same as the other templates. */
  :root, html[data-theme="dark"] {
    --bg:#0f172a; --panel:#1e293b; --ink:#e2e8f0; --muted:#94a3b8; --border:#334155; --accent:#38bdf8; --link:#7dd3fc;
  }
  html[data-theme="light"] {
    --bg:#f8fafc; --panel:#ffffff; --ink:#0f172a; --muted:#475569; --border:#e2e8f0; --accent:#0284c7; --link:#0369a1;
  }
  /* Fonts — theme-independent. Default = system stack (output unchanged unless a preset is chosen).
     For an aesthetic direction, override these two with an OFFLINE system-font preset
     (see references/authoring.md -> "Visual polish"). Never load fonts over the network. */
  :root { --display-font: system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
          --body-font:    system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); transition:background .2s,color .2s;
         font-family: var(--body-font); line-height:1.65; }
  .container { max-width:860px; margin:0 auto; padding:48px 24px 96px; }
  h1 { font-size:2.2rem; line-height:1.15; margin:0 0 .4em; font-family: var(--display-font); }
  h2 { font-size:1.5rem; margin:2em 0 .5em; border-bottom:1px solid var(--border); padding-bottom:.25em; font-family: var(--display-font); }
  h3 { font-size:1.15rem; margin:1.6em 0 .4em; font-family: var(--display-font); }
  p, li { color:var(--ink); }
  a { color:var(--link); }
  .lead { font-size:1.2rem; color:var(--muted); }
  .muted { color:var(--muted); }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:20px 22px; margin:16px 0; }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
  .badge { display:inline-block; background:var(--accent); color:#04212e; border-radius:999px; padding:2px 12px; font-size:.8rem; font-weight:600; }
  table { width:100%; border-collapse:collapse; margin:16px 0; }
  th, td { border:1px solid var(--border); padding:8px 12px; text-align:left; }
  th { background:var(--panel); }
  code, pre { background:var(--panel); border:1px solid var(--border); border-radius:8px; }
  code { padding:.1em .4em; } pre { padding:14px 16px; overflow:auto; }
  hr { border:0; border-top:1px solid var(--border); margin:2em 0; }
  .btn { display:inline-block; background:var(--accent); color:#04212e; text-decoration:none; font-weight:600;
         border-radius:10px; padding:10px 18px; margin:6px 8px 6px 0; }
  .chart-wrap { position:relative; height:340px; margin:16px 0; }

  .toolbar { position:fixed; top:16px; right:18px; display:flex; gap:8px; z-index:50; }
  .toolbar button { background:var(--panel); color:var(--ink); border:1px solid var(--border); border-radius:8px;
                    padding:6px 12px; font-size:.85rem; cursor:pointer; }
  .toolbar button:hover { border-color:var(--accent); }
  @media print {
    @page { margin: 16mm; }
    body { background:#fff; }
    .toolbar { display:none !important; }
    .container { max-width:none; padding:0; }
    .card, pre, table, .chart-wrap { break-inside:avoid; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button id="themeBtn" onclick="toggleTheme()">☀ Light</button>
  <button onclick="printPage()" title="Save as PDF (P)">⤓ PDF</button>
</div>

<div class="container">
  <!-- CONTENT placeholder below: the full page body — headings, paragraphs, lists, tables,
       .card / .grid blocks, links/buttons, and optionally <div class="chart-wrap"><canvas id="p1"></canvas></div>. -->
  {{CONTENT}}
</div>

<!-- LIB placeholder below: include ONLY if the page has a <canvas> chart. Inline the bundled
     Chart.js (fully-local) or a CDN script tag. Omit entirely for pages with no charts. -->
{{LIB}}

<script>
  function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function applyChartDefaults(){ if(typeof Chart==='undefined') return;
    Chart.defaults.color = cssVar('--ink'); Chart.defaults.borderColor = cssVar('--border'); }
  function eachChart(fn){ if(typeof Chart==='undefined') return;
    document.querySelectorAll('canvas').forEach(cv=>{ const c=Chart.getChart(cv); if(c){ try{ fn(c); }catch(e){} } }); }
  function setTheme(t){ document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('viz-theme', t); }catch(e){}
    document.getElementById('themeBtn').textContent = (t==='dark' ? '☀ Light' : '☾ Dark');
    applyChartDefaults(); eachChart(c=> c.update()); renderMermaid(); }
  function toggleTheme(){ setTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark'); }

  // Mermaid diagrams stay theme-synced. Add a diagram by inlining Mermaid in {{LIB}} and dropping a
  // <pre class="mermaid">…source…</pre> into the content — the template renders it and re-themes it. No manual init needed.
  var _mmd = [];
  function initMermaidSources(){ if(typeof mermaid==='undefined') return;
    document.querySelectorAll('pre.mermaid, .mermaid').forEach(el=> _mmd.push([el, el.textContent])); }
  function mmVars(dark){ return dark ? {
    darkMode:true, background:'transparent', fontFamily:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif", fontSize:'14px',
    primaryColor:'#1e293b', mainBkg:'#1e293b', primaryBorderColor:'#475569', nodeBorder:'#475569',
    primaryTextColor:'#e2e8f0', nodeTextColor:'#e2e8f0', textColor:'#e2e8f0', titleColor:'#e2e8f0',
    lineColor:'#64748b', secondaryColor:'#0b1120', tertiaryColor:'#0b1120',
    clusterBkg:'rgba(148,163,184,0.08)', clusterBorder:'#334155', edgeLabelBackground:'#0f172a'
  } : {
    darkMode:false, background:'transparent', fontFamily:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif", fontSize:'14px',
    primaryColor:'#f1f5f9', mainBkg:'#f1f5f9', primaryBorderColor:'#94a3b8', nodeBorder:'#94a3b8',
    primaryTextColor:'#0f172a', nodeTextColor:'#0f172a', textColor:'#0f172a', titleColor:'#0f172a',
    lineColor:'#64748b', secondaryColor:'#f1f5f9', tertiaryColor:'#f1f5f9',
    clusterBkg:'rgba(2,132,199,0.06)', clusterBorder:'#cbd5e1', edgeLabelBackground:'#ffffff'
  }; }
  function renderMermaid(){ if(typeof mermaid==='undefined' || !_mmd.length) return;
    var dark = document.documentElement.getAttribute('data-theme')==='dark';
    mermaid.initialize({ startOnLoad:false, theme:'base', themeVariables:mmVars(dark),
      flowchart:{ curve:'basis', padding:14, useMaxWidth:true }, securityLevel:'loose' });
    _mmd.forEach(function(m){ m[0].removeAttribute('data-processed'); m[0].innerHTML = m[1]; });
    try{ mermaid.run({ nodes:_mmd.map(function(m){ return m[0]; }) }); }catch(e){} }
  initMermaidSources();

  (function(){ let t='dark'; try{ t=localStorage.getItem('viz-theme')||'dark'; }catch(e){} setTheme(t); })();
  applyChartDefaults();

  let _prevTheme=null;
  window.addEventListener('beforeprint', function(){
    _prevTheme = document.documentElement.getAttribute('data-theme');
    if(_prevTheme!=='light'){ document.documentElement.setAttribute('data-theme','light'); applyChartDefaults(); }
    eachChart(c=>{ c.resize(); c.update('none'); }); renderMermaid();
  });
  window.addEventListener('afterprint', function(){
    if(_prevTheme && _prevTheme!=='light'){ document.documentElement.setAttribute('data-theme',_prevTheme); applyChartDefaults(); }
    eachChart(c=>{ c.resize(); c.update('none'); }); renderMermaid();
  });
  function printPage(){ window.print(); }
  document.addEventListener('keydown', e=>{ if(e.key==='p'||e.key==='P'){ printPage(); e.preventDefault(); } });

  // SCRIPT placeholder below: optional page JS — Chart.js chart(s), interactivity, etc.
  {{SCRIPT}}
</script>
</body>
</html>
