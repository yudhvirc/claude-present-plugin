<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  /* Single-page interactive REPORT — tabbed sections + hover tooltips. Premium, offline, theme + PDF. */
  :root, html[data-theme="dark"] {
    --bg:#0b1220; --panel:#141f33; --elev:#1b2740; --ink:#e9eef7; --muted:#94a5be; --border:#243149;
    --accent:#38bdf8; --accent2:#818cf8; --link:#7dd3fc; --tabbg:#0e1728;
    --tint1:rgba(56,189,248,.12); --tint1e:rgba(56,189,248,0); --tint2:rgba(129,140,248,.10); --tint2e:rgba(129,140,248,0); --hover-bd:#33507d; --row:rgba(56,189,248,.06);
    --shadow:0 16px 40px -20px rgba(0,0,0,.65); --ring:rgba(56,189,248,.35);
  }
  html[data-theme="light"] {
    --bg:#f5f7fb; --panel:#ffffff; --elev:#f7f9fc; --ink:#0f1b2e; --muted:#4a5a72; --border:#e6ebf3;
    --accent:#0284c7; --accent2:#4f46e5; --link:#0369a1; --tabbg:#eef2f8;
    --tint1:rgba(2,132,199,.07); --tint1e:rgba(2,132,199,0); --tint2:rgba(79,70,229,.05); --tint2e:rgba(79,70,229,0); --hover-bd:#a7cdea; --row:rgba(2,132,199,.05);
    --shadow:0 18px 44px -22px rgba(15,23,42,.22); --ring:rgba(2,132,199,.28);
  }
  :root { --display-font: system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
          --body-font:    system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--ink); font-family:var(--body-font); line-height:1.65; letter-spacing:.1px;
         -webkit-font-smoothing:antialiased; transition:background .25s,color .25s;
         background:radial-gradient(1100px 520px at 12% -8%, var(--tint1), var(--tint1e) 60%),
                    radial-gradient(1000px 520px at 100% -5%, var(--tint2), var(--tint2e) 55%),
                    var(--bg); background-attachment:fixed; }
  .wrap { max-width:1080px; margin:0 auto; padding:48px 24px 80px; }
  header h1 { font-family:var(--display-font); font-size:2.3rem; line-height:1.1; letter-spacing:-.02em; font-weight:800; margin:0 0 .15em; color:var(--ink); }
  header .sub { color:var(--muted); font-size:1.12rem; margin:0 0 22px; }
  h2 { font-family:var(--display-font); font-size:1.4rem; font-weight:700; letter-spacing:-.01em; margin:0 0 .6em; }
  h3 { font-family:var(--display-font); font-size:1.05rem; font-weight:700; margin:1.4em 0 .4em; }
  a { color:var(--link); text-underline-offset:3px; }
  .muted { color:var(--muted); }

  /* Tabs */
  .tabs { position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; gap:6px; padding:10px 0;
          background:var(--bg); border-bottom:1px solid var(--border); margin-bottom:26px; }
  .tab { appearance:none; background:transparent; color:var(--muted); border:0; border-radius:10px;
         padding:9px 16px; font-size:.95rem; font-weight:650; cursor:pointer; transition:background .15s,color .15s; }
  .tab:hover { color:var(--ink); background:var(--tabbg); }
  .tab.active { color:#fff; background:linear-gradient(120deg,var(--accent),var(--accent2)); box-shadow:0 8px 20px -10px var(--ring); }
  .panel { display:none; animation:fade .28s ease; }
  .panel.active { display:block; }
  @keyframes fade { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .panel-title { display:none; }   /* shown only in print */

  /* Content blocks */
  .card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:20px 22px; margin:16px 0;
          box-shadow:var(--shadow); transition:transform .18s,border-color .18s; }
  .card:hover { transform:translateY(-2px); border-color:var(--hover-bd); }
  .grid { display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
  .kpi { position:relative; background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:18px 20px 18px 22px;
         box-shadow:var(--shadow); overflow:hidden; transition:transform .18s,border-color .18s; }
  .kpi::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:linear-gradient(var(--accent),var(--accent2)); }
  .kpi:hover { transform:translateY(-2px); border-color:var(--hover-bd); }
  .kpi .n { font-family:var(--display-font); font-size:2rem; font-weight:800; letter-spacing:-.02em; color:var(--ink); }
  .kpi .l { color:var(--muted); font-size:.85rem; margin-top:2px; }
  table { width:100%; border-collapse:separate; border-spacing:0; margin:16px 0; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  th, td { padding:11px 14px; text-align:left; border-bottom:1px solid var(--border); }
  th { background:var(--elev); font-size:.76rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  tr:last-child td { border-bottom:0; } tbody tr:hover td { background:var(--row); }
  .chart-wrap { position:relative; height:340px; margin:8px 0; }
  .badge { display:inline-block; background:linear-gradient(120deg,var(--accent),var(--accent2)); color:#fff; border-radius:999px;
           padding:4px 14px; font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; box-shadow:0 8px 20px -10px var(--ring); }

  /* Gradient headline + KPI numbers, only where background-clip:text is supported (falls back to solid --ink). */
  @supports ((-webkit-background-clip:text) or (background-clip:text)) {
    header h1, .kpi .n { background:linear-gradient(120deg,var(--ink) 25%,var(--accent)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  }

  /* Tooltip — pure CSS, offline. Use <span class="tip" data-tip="explanation">term</span> */
  .tip { position:relative; border-bottom:1px dotted var(--muted); cursor:help; }
  .tip:hover::after, .tip:focus::after { content:attr(data-tip); position:absolute; left:50%; bottom:calc(100% + 8px);
    transform:translateX(-50%); background:var(--elev); color:var(--ink); border:1px solid var(--border);
    border-radius:10px; padding:9px 12px; width:max-content; max-width:280px; white-space:normal; font-size:.82rem;
    font-weight:400; line-height:1.45; z-index:60; box-shadow:0 12px 30px -8px rgba(0,0,0,.4); }
  .tip:hover::before, .tip:focus::before { content:""; position:absolute; left:50%; bottom:calc(100% + 2px);
    transform:translateX(-50%); border:6px solid transparent; border-top-color:var(--border); z-index:60; }

  .toolbar { position:fixed; top:16px; right:18px; display:flex; gap:8px; z-index:50; }
  .toolbar button { background:var(--panel); color:var(--ink); border:1px solid var(--border); border-radius:10px;
                    padding:7px 13px; font-size:.85rem; cursor:pointer; box-shadow:var(--shadow); transition:border-color .15s,transform .15s; }
  .toolbar button:hover { border-color:var(--accent); transform:translateY(-1px); }
  footer { color:var(--muted); font-size:.8rem; margin-top:36px; }

  /* Print / PDF: show ALL tabs' content, each with its title; hide chrome. */
  body.printing .tabs { display:none; }
  body.printing .panel { display:block !important; }
  body.printing .panel-title { display:block; margin-top:28px; }
  /* Mobile */
  @media (max-width: 640px) {
    body { background-attachment:scroll; }
    .wrap { padding:58px 16px 64px; }
    header h1 { font-size:1.9rem; }
    header .sub { font-size:1rem; }
    .toolbar { top:10px; right:10px; }
    .toolbar button { padding:6px 11px; font-size:.8rem; }
    .tabs { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .tabs::-webkit-scrollbar { display:none; }
    .tab { flex:0 0 auto; white-space:nowrap; }
    .kpi .n { font-size:1.7rem; }
    .grid { grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }  /* KPIs 2-up, shrink to fit */
    table { display:block; overflow-x:auto; white-space:nowrap; }
    .tip:hover::after, .tip:focus::after { max-width:78vw; }
    .chart-wrap { height:300px; }
  }
  @media (max-width: 380px) { .grid { grid-template-columns:1fr; } }   /* stack on very narrow */
  @media print {
    @page { margin: 14mm; }
    body { background:#fff; }
    .toolbar, .tabs { display:none !important; }
    .panel { display:block !important; }
    .panel-title { display:block; }
    .card, table, .chart-wrap, .kpi { break-inside:avoid; box-shadow:none; }
    header h1, .kpi .n { -webkit-text-fill-color:var(--ink); color:var(--ink); }
  }
</style>
<!-- FONTS placeholder below: build.js fills this with an inlined offline designer-font preset when
     --fonts is passed (e.g. --fonts fraunces-inter). Left empty = the system font stack. -->
{{FONTS}}
</head>
<body>
<div class="toolbar">
  <button id="themeBtn" onclick="toggleTheme()">☀ Light</button>
  <button onclick="printPage()" title="Save as PDF (P)">⤓ PDF</button>
</div>

<div class="wrap">
  <header>
    <h1>{{TITLE}}</h1>
    <p class="sub">{{SUBTITLE}}</p>
  </header>

  <!-- TABS placeholder below: one <button> per section. data-panel must match a panel id.
       <button class="tab" data-panel="overview">Overview</button>
       <button class="tab" data-panel="trends">Trends</button> -->
  <nav class="tabs" role="tablist" aria-label="Report sections">
    {{TABS}}
  </nav>

  <main>
    <!-- PANELS placeholder below: one <section class="panel" id="…"> per tab (id matches data-panel).
         Start the FIRST panel with class="panel active". Put a hidden print title as the first child.
    <section class="panel active" id="overview">
      <h2 class="panel-title">Overview</h2>
      <div class="grid">
        <div class="kpi"><div class="n">$343K</div><div class="l">Dec revenue</div></div>
      </div>
      <p>Use <span class="tip" data-tip="Monthly recurring revenue">MRR</span> for the run-rate view.</p>
      <div class="chart-wrap"><canvas id="c1"></canvas></div>
    </section> -->
    {{PANELS}}
  </main>

  <footer>Generated by /present · self-contained interactive report · opens in any browser.</footer>
</div>

<!-- LIB placeholder below: inline Chart.js and/or Mermaid here (fully offline). Omit if the report has neither. -->
{{LIB}}

<script>
  function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function applyChartDefaults(){ if(typeof Chart==='undefined') return;
    Chart.defaults.color = cssVar('--ink'); Chart.defaults.borderColor = cssVar('--border'); }
  function eachChart(fn){ if(typeof Chart==='undefined') return;
    document.querySelectorAll('canvas').forEach(cv=>{ const c=Chart.getChart(cv); if(c){ try{ fn(c); }catch(e){} } }); }

  // Mermaid, themed to match the plugin palette (base theme) in light + dark.
  var _mmd = [];
  function initMermaidSources(){ if(typeof mermaid==='undefined') return;
    document.querySelectorAll('pre.mermaid, .mermaid').forEach(el=> _mmd.push([el, el.textContent])); }
  function mmVars(dark){ return dark ? {
    darkMode:true, background:'transparent', fontFamily:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif", fontSize:'14px',
    primaryColor:'#1e293b', mainBkg:'#1e293b', primaryBorderColor:'#475569', nodeBorder:'#475569',
    primaryTextColor:'#e2e8f0', nodeTextColor:'#e2e8f0', textColor:'#e2e8f0', titleColor:'#e2e8f0',
    lineColor:'#64748b', secondaryColor:'#0b1120', tertiaryColor:'#0b1120',
    clusterBkg:'rgba(148,163,184,0.08)', clusterBorder:'#334155', edgeLabelBackground:'#0f172a',
    attributeBackgroundColorOdd:'#111c31', attributeBackgroundColorEven:'#0b1424'   /* ER rows — dark, readable */
  } : {
    darkMode:false, background:'transparent', fontFamily:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif", fontSize:'14px',
    primaryColor:'#f1f5f9', mainBkg:'#f1f5f9', primaryBorderColor:'#94a3b8', nodeBorder:'#94a3b8',
    primaryTextColor:'#0f172a', nodeTextColor:'#0f172a', textColor:'#0f172a', titleColor:'#0f172a',
    lineColor:'#64748b', secondaryColor:'#f1f5f9', tertiaryColor:'#f1f5f9',
    clusterBkg:'rgba(2,132,199,0.06)', clusterBorder:'#cbd5e1', edgeLabelBackground:'#ffffff',
    attributeBackgroundColorOdd:'#ffffff', attributeBackgroundColorEven:'#eef2f8'   /* ER rows — light */
  }; }
  var _rendering = null;
  function renderMermaid(){ if(typeof mermaid==='undefined' || !_mmd.length) return _rendering || Promise.resolve();
    // Serialize renders so two mermaid.run() calls never overlap (overlap → intermittent "Syntax error in text").
    _rendering = Promise.resolve(_rendering).catch(function(){}).then(function(){
      var dark = document.documentElement.getAttribute('data-theme')==='dark';
      mermaid.initialize({ startOnLoad:false, theme:'base', themeVariables:mmVars(dark),
        flowchart:{ curve:'basis', padding:14, useMaxWidth:true }, securityLevel:'loose' });
      _mmd.forEach(function(m){ m[0].removeAttribute('data-processed'); m[0].innerHTML = m[1]; });
      var _nodes = _mmd.map(function(m){ return m[0]; });
      return withMeasurable(_nodes, function(){ return mermaid.run({ nodes:_nodes }); });
    });
    return _rendering; }
  // Mermaid measures label text in the live DOM. A diagram inside a hidden container
  // (an inactive tab panel, an off-screen slide) measures 0, dagre then emits
  // "translate(undefined, NaN)" and Mermaid paints its generic "Syntax error" SVG.
  // Reveal any hidden ancestors off-screen for the duration of the run, then restore.
  function withMeasurable(els, fn){
    var stash=[];
    els.forEach(function(el){
      for(var n=el; n && n.nodeType===1; n=n.parentElement){
        if(!n.__mmStash && getComputedStyle(n).display==='none'){
          n.__mmStash=1; stash.push([n, n.getAttribute('style')]);
          n.style.setProperty('display','block','important');
          n.style.setProperty('position','absolute','important');
          n.style.setProperty('visibility','hidden','important');
          n.style.setProperty('left','-99999px','important');
          n.style.setProperty('width','1100px','important');
        }
      }
    });
    function restore(){ stash.forEach(function(s){
      if(s[1]===null) s[0].removeAttribute('style'); else s[0].setAttribute('style',s[1]);
      delete s[0].__mmStash; }); stash=[]; }
    var r; try{ r=fn(); }catch(e){ restore(); throw e; }
    if(r && typeof r.then==='function') r.then(restore, restore); else restore();
    return r;
  }

  function setTheme(t){ document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('viz-theme', t); }catch(e){}
    document.getElementById('themeBtn').textContent = (t==='dark' ? '☀ Light' : '☾ Dark');
    applyChartDefaults(); eachChart(c=> c.update()); renderMermaid(); }
  function toggleTheme(){ setTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark'); }

  // Tabs
  var _tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var _panels = Array.prototype.slice.call(document.querySelectorAll('.panel'));
  function showTab(id){
    _tabs.forEach(function(t){ t.classList.toggle('active', t.getAttribute('data-panel')===id); });
    _panels.forEach(function(p){ p.classList.toggle('active', p.id===id); });
    eachChart(function(c){ c.resize(); });   // charts created in a hidden panel need a resize when shown
    try{ history.replaceState(null,'', '#p-'+id); }catch(e){}   // 'p-' prefix so it never matches a panel id (avoids scroll-to-fragment)
  }
  _tabs.forEach(function(t){ t.addEventListener('click', function(){ showTab(t.getAttribute('data-panel')); }); });
  document.addEventListener('keydown', function(e){
    if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
    var i = _tabs.findIndex(function(t){ return t.classList.contains('active'); });
    if(i<0) return; i = (i + (e.key==='ArrowRight'?1:-1) + _tabs.length) % _tabs.length;
    _tabs[i].focus(); showTab(_tabs[i].getAttribute('data-panel'));
  });

  // PDF export — reveal all panels (so the whole report prints) in light theme, then restore.
  var _prevTheme=null, _prevTab=null;
  window.addEventListener('beforeprint', function(){
    _prevTheme = document.documentElement.getAttribute('data-theme');
    var active = _tabs.find(function(t){ return t.classList.contains('active'); });
    _prevTab = active ? active.getAttribute('data-panel') : null;
    if(_prevTheme!=='light'){ document.documentElement.setAttribute('data-theme','light'); applyChartDefaults(); }
    document.body.classList.add('printing');
    void document.body.offsetHeight;
    eachChart(function(c){ c.resize(); c.update('none'); }); renderMermaid();
  });
  window.addEventListener('afterprint', function(){
    document.body.classList.remove('printing');
    if(_prevTheme && _prevTheme!=='light'){ document.documentElement.setAttribute('data-theme',_prevTheme); applyChartDefaults(); }
    if(_prevTab) showTab(_prevTab);
    eachChart(function(c){ c.resize(); c.update('none'); }); renderMermaid();
  });
  function printPage(){ window.print(); }
  document.addEventListener('keydown', function(e){ if(e.key==='p'||e.key==='P'){ printPage(); e.preventDefault(); } });

  // Init
  if('scrollRestoration' in history){ try{ history.scrollRestoration='manual'; }catch(e){} }
  // Disable Mermaid's built-in auto-run immediately so it never races our explicit, themed render.
  if(typeof mermaid!=='undefined'){ try{ mermaid.initialize({ startOnLoad:false }); }catch(e){} }
  initMermaidSources();
  (function(){ var h=(location.hash||'').replace(/^#p-/,'').replace(/^#/,''); var ids=_panels.map(function(p){return p.id;});
    showTab(ids.indexOf(h)>=0 ? h : (ids[0]||'')); })();
  (function(){ let t='dark'; try{ t=localStorage.getItem('viz-theme')||'dark'; }catch(e){} setTheme(t); })();
  // Open at the top (activating a panel/updating the hash can nudge the scroll position).
  try{ window.scrollTo(0,0); }catch(e){}
  window.addEventListener('load', function(){ try{ window.scrollTo(0,0); }catch(e){} });

  // SCRIPT placeholder below: build charts (Chart.js) here; don't hardcode tick/grid colors (they follow the theme).
  {{SCRIPT}}
</script>
</body>
</html>
